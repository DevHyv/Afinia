name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Obtener código del repositorio
      uses: actions/checkout@v5

    - name: Configurar JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar entorno de Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Instalar dependencias para Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev ccache libltdl-dev
        pip install --upgrade buildozer kivy cython

    - name: Compilar APK con Buildozer
      run: |
        yes | buildozer android debug

    - name: Subir el APK generado a los Artefactos
      uses: actions/upload-artifact@v5
      with:
        name: Afinia-APK
        path: bin/*.apk

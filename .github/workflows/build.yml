name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ¡ATENCIÓN A ESTE PASO! Añadí portaudio19-dev para que pyaudio se instale bien
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev ccache libltdl-dev portaudio19-dev

      - name: Instalar Buildozer y dependencias Python
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0
          pip install cython==3.0.10
          pip install kivy==2.3.0

      - name: Compilar APK
        run: |
          yes | buildozer android debug

      - name: Subir el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Afinia-APK
          path: bin/*.apk
          if-no-files-found: error

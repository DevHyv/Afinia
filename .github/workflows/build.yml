name: Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio con la versión v4
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Java con la versión v5 (resuelve el warning de v4)
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Cambia a 'maven' si usas Maven en lugar de Gradle

      # 3. Dar permisos de ejecución al script Gradle Wrapper (para entornos Linux/macOS)
      - name: Otorgar permisos de ejecución a gradlew
        run: chmod +x gradlew
        continue-on-error: true # Ignora si el proyecto no usa gradlew

      # 4. Compilar y ejecutar pruebas en Android / Java (Gradle)
      - name: Compilar con Gradle
        run: ./gradlew build --stacktrace
        continue-on-error: false

      # 5. (Opcional) Si tu proyecto también usa Node.js / NPM para el frontend/UI
      # - name: Configurar Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
